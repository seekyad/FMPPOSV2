services:
  - type: web
    name: fmp-pos
    runtime: node
    plan: starter
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fmp-pos-db
          property: connectionString

databases:
  - name: fmp-pos-db
    plan: basic-256mb
